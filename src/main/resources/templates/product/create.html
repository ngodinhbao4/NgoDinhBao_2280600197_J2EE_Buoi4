<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thêm sản phẩm mới</title>
    <style>
        .form-group { margin-bottom: 20px; }
        .form-label { 
            display: block; 
            font-weight: 600; 
            color: var(--text-main); 
            margin-bottom: 8px; 
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            flex: 1;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-secondary:hover { background: #e2e8f0; }
        button[type="submit"] { flex: 2; margin-top: 0; }
        
        /* Hiệu ứng focus cho file input */
        input[type="file"] {
            border: 1.5px dashed #e2e8f0;
            padding: 20px;
            background: #f8fafc;
            cursor: pointer;
            width: 100%;
            border-radius: 8px;
        }
        input[type="file"]:hover { border-color: var(--primary); background: #f1f5f9; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <h2>
        <span>&#10133; Add New Product</span>
    </h2>

    <form th:action="@{/products/create}" th:object="${product}" method="post" enctype="multipart/form-data" style="max-width: 700px; margin-top: 2rem;">
        
        <div class="form-group">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="e.g., Mechanical Keyboard" />
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="form-group">
            <label for="price" class="form-label">Price (VND)</label>
            <input type="number" id="price" th:field="*{price}" placeholder="Enter the amount..." />
            <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div class="form-group">
            <label for="categoryId" class="form-label">Category</label>
            <select name="categoryId" id="categoryId">
                <option value="0" selected disabled>-- Please select a category --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="imageProduct" class="form-label">Product Image</label>
            <input type="file" id="imageProduct" name="imageProduct" accept="image/*" />
            <p class="error" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></p>
        </div>

        <div class="btn-group">
            <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
    </form>
</div>
</body>
</html>
