<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thêm sản phẩm mới</title>
    <style>
        .form-group { margin-bottom: 20px; }
        .form-label { 
            display: block; 
            font-weight: 600; 
            color: var(--text-main); 
            margin-bottom: 8px; 
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            flex: 1;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-secondary:hover { background: #e2e8f0; }
        button[type="submit"] { flex: 2; margin-top: 0; }
        
        /* Hiệu ứng focus cho file input */
        input[type="file"] {
            border: 1.5px dashed #e2e8f0;
            padding: 20px;
            background: #f8fafc;
            cursor: pointer;
            width: 100%;
            border-radius: 8px;
        }
        input[type="file"]:hover { border-color: var(--primary); background: #f1f5f9; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <h2>
        <span>➕ THÊM MỚI SẢN PHẨM</span>
    </h2>

    <form th:action="@{/products/create}" th:object="${product}" method="post" enctype="multipart/form-data" style="max-width: 600px; margin-top: 30px;">
        
        <div class="form-group">
            <label class="form-label">Tên sản phẩm</label>
            <input type="text" th:field="*{name}" placeholder="Ví dụ: Bàn phím cơ Pixel Art" />
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="form-group">
            <label class="form-label">Giá sản phẩm (VNĐ)</label>
            <input type="number" th:field="*{price}" placeholder="Nhập số tiền..." />
            <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div class="form-group">
            <label class="form-label">Danh mục</label>
            <select name="categoryId">
                <option value="0" selected disabled>-- Vui lòng chọn danh mục --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"></option>
            </select>
            </div>

        <div class="form-group">
            <label class="form-label">Hình ảnh minh họa</label>
            <input type="file" name="imageProduct" accept="image/*" />
            <div style="margin-top: 8px; font-size: 12px; color: var(--text-muted);">
                * Hỗ trợ định dạng JPG, PNG, WebP. Tối đa 5MB.
            </div>
            <p class="error" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></p>
        </div>

        <div class="btn-group">
            <a th:href="@{/products}" class="btn-secondary">Quay lại danh sách</a>
            <button type="submit">Lưu sản phẩm</button>
        </div>
    </form>
</div>
</body>
</html>
