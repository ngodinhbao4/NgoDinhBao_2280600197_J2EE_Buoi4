<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>Thêm sản phẩm mới</title>
</head>
<body>
<div layout:fragment="content">
  <h2>THÊM MỚI SẢN PHẨM</h2>
  <form th:action="@{/products/create}" th:object="${product}" method="post" enctype="multipart/form-data">

    <div style="margin-bottom: 15px;">
      <label>Tên sản phẩm:</label><br>
      <input type="text" th:field="*{name}" style="width: 300px;"/>
      <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Giá sản phẩm:</label><br>
      <input type="number" th:field="*{price}" />
      <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Danh mục:</label><br>
      <select name="categoryId">
        <option value="0">-- Chọn danh mục --</option>
        <option th:each="cat : ${categories}"
                th:value="${cat.id}"
                th:text="${cat.name}"></option>
      </select>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Hình ảnh:</label><br>
      <input type="file" name="imageProduct" accept="image/*" />
      <div class="error" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></div>
    </div>

    <button type="submit" style="padding: 10px 20px; background: green; color: white; border: none; cursor: pointer;">
      Lưu sản phẩm
    </button>
  </form>
</div>
</body>
</html>
