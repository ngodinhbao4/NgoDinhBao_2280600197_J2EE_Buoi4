<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Chỉnh sửa sản phẩm</title>
    <style>
        .form-group { margin-bottom: 20px; }
        .form-label { 
            display: block; 
            font-weight: 600; 
            color: var(--text-main); 
            margin-bottom: 8px; 
            font-size: 14px;
        }
        .image-preview-box {
            background: #f8fafc;
            border: 1.5px dashed #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            flex: 1;
            transition: 0.2s;
        }
        .btn-secondary:hover { background: #e2e8f0; }
        button[type="submit"] { flex: 2; margin-top: 0; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <h2>
        <span>&#9998; Edit Product</span>
    </h2>

    <form th:action="@{/products/edit}" th:object="${product}" method="post" enctype="multipart/form-data" style="max-width: 700px; margin-top: 2rem;">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" id="name" th:field="*{name}" />
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="form-group">
            <label for="price" class="form-label">Price (VND)</label>
            <input type="number" id="price" th:field="*{price}" />
            <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div class="form-group">
            <label for="categoryId" class="form-label">Category</label>
            <select name="categoryId" id="categoryId">
                <option value="" disabled>-- Select a category --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${product.category != null && cat.id == product.category.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Product Image</label>
            
            <div th:if="*{image}" style="margin-bottom: 1.5rem; background: #f9fafb; border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 1rem; display: inline-block;">
                <p style="font-size: 0.8rem; color: var(--text-muted); margin:0 0 0.5rem 0;">Current Image:</p>
                <img th:src="@{'/images/' + *{image}}" width="150" style="border-radius: 0.25rem;"/>
            </div>

            <div>
                <label for="imageProduct" class="form-label" style="font-size: 0.9rem; font-weight: 500;">Upload New Image (optional)</label>
                <input type="file" id="imageProduct" name="imageProduct" accept="image/*" />
            </div>
        </div>

        <div class="btn-group">
            <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
</body>
</html>
