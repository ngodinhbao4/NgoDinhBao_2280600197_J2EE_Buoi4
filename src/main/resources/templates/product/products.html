<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Danh sách sản phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <h2>DANH SÁCH SẢN PHẨM</h2>
    <table border="1" style="width:100%; border-collapse: collapse;">
        <thead>
        <tr style="background-color: #eee;">
            <th>ID</th>
            <th>Hình ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Danh mục</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${listproduct}">
            <td th:text="${p.id}"></td>
            <td>
                <img th:if="${p.image}" th:src="@{'/images/' + ${p.image}}" width="70" height="70" style="object-fit: cover;"/>
                <span th:unless="${p.image}">No Image</span>
            </td>
            <td th:text="${p.name}"></td>
            <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
            <td th:text="${p.category != null ? p.category.name : 'N/A'}"></td>
            <td>
                <a th:href="@{/products/edit/{id}(id=${p.id})}">Sửa</a> |
                <a th:href="@{/products/delete/{id}(id=${p.id})}"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listproduct)}">
            <td colspan="6" style="text-align: center;">Chưa có sản phẩm nào.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
