<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Danh sách sản phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <h2>
        <span> DANH SÁCH SẢN PHẨM</span>
        <a th:href="@{/products/create}" 
           style="background: var(--primary); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 14px;">
           + Thêm mới
        </a>
    </h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Hình ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Giá bán</th>
            <th>Danh mục</th>
            <th style="text-align: center;">Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${listproduct}">
            <td th:text="${p.id}" style="font-weight: 600; color: var(--text-muted);"></td>
            <td>
                <div style="width: 60px; height: 60px; overflow: hidden; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <img th:if="${p.image}" th:src="@{'/images/' + ${p.image}}" 
                         style="width: 100%; height: 100%; object-fit: cover;"/>
                    <div th:unless="${p.image}" 
                         style="width: 100%; height: 100%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #94a3b8;">
                         No Image
                    </div>
                </div>
            </td>
            <td>
                <span th:text="${p.name}" style="font-weight: 600; color: var(--text-main);"></span>
            </td>
            <td>
                <span th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}" 
                      style="color: var(--primary); font-weight: 700;"></span> 
                <small style="color: var(--text-muted);">VNĐ</small>
            </td>
            <td>
                <span th:text="${p.category != null ? p.category.name : 'Chưa phân loại'}"
                      style="background: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-size: 13px;"></span>
            </td>
            <td style="text-align: center;">
                <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn-edit">
                     Sửa
                </a>
                <a th:href="@{/products/delete/{id}(id=${p.id})}" 
                   class="btn-delete"
                   onclick="return confirm('Hành động này không thể hoàn tác. Bạn chắc chắn muốn xóa sản phẩm này?')">
                     Xóa
                </a>
            </td>
        </tr>
        
        <tr th:if="${#lists.isEmpty(listproduct)}">
            <td colspan="6" style="text-align: center; padding: 50px; color: var(--text-muted);">
                <div style="font-size: 40px; margin-bottom: 10px;">Empty</div>
                Hiện chưa có sản phẩm nào trong hệ thống.
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
