<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Danh sách sản phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <h2>
        <span>Product Portfolio</span>
        <a th:href="@{/products/create}" class="btn btn-primary">
           + Add New Product
        </a>
    </h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Category</th>
            <th style="text-align: center;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${listproduct}">
            <td th:text="${p.id}" style="font-weight: 600;"></td>
            <td>
                <div style="width: 60px; height: 60px; overflow: hidden; border-radius: 0.5rem; border: 1px solid var(--border-color);">
                    <img th:if="${p.image}" th:src="@{'/images/' + ${p.image}}" 
                         style="width: 100%; height: 100%; object-fit: cover;"/>
                    <div th:unless="${p.image}" 
                         style="width: 100%; height: 100%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #94a3b8;">
                         No Image
                    </div>
                </div>
            </td>
            <td>
                <span th:text="${p.name}" style="font-weight: 600; color: var(--text-main);"></span>
            </td>
            <td>
                <span th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}" 
                      style="color: var(--primary-color); font-weight: 700;"></span> 
                <small style="color: var(--text-muted);">VND</small>
            </td>
            <td>
                <span th:text="${p.category != null ? p.category.name : 'Uncategorized'}"
                      style="background: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-size: 13px;"></span>
            </td>
            <td style="text-align: center;">
                <div class="action-group">
                    <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-secondary">
                         Sửa
                    </a>
                    <a th:href="@{/products/delete/{id}(id=${p.id})}" 
                       class="btn btn-danger"
                       onclick="return confirm('This action cannot be undone. Are you sure you want to delete this product?')">
                         Xóa
                    </a>
                </div>
            </td>
        </tr>
        
        <tr th:if="${#lists.isEmpty(listproduct)}">
            <td colspan="6" style="text-align: center; padding: 50px; color: var(--text-muted);">
                <div style="font-size: 40px; margin-bottom: 10px;">🗑️</div>
                There are no products in the system yet.
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
